<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal galuh imut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header>
            <p class="eyebrow">PERSONAL STUDY SPACE</p>
            <h1>Jadwal <em>gue.</em></h1>
            <p class="subtitle">lulus ke unilever/idx</p>
        </header>

        <section class="today">
            <div>
                <p class="eyebrow">tudey</p>
                <h2 id="today-title">jdwal mas</h2>
                <p id="today-summary">hari?</p>
            </div>
            <div class="total">
                <strong id="today-count">0</strong>
                <span>kelas</span>
            </div>
        </section>

        <nav class="day-tabs">
            <button class="active" data-day="Senin">Senin</button>
            <button data-day="Selasa">Selasa</button>
            <button data-day="Rabu">Rabu</button>
            <button data-day="Kamis">Kamis</button>
            <button data-day="Jumat">Jumat</button>
        </nav>

        <section class="schedule">
            <div class="section-title">
                <h2 id="selected-day">Senin</h2>
                <span id="day-count">2 kelas</span>
            </div>
            <div id="schedule-list"></div>
        </section>

        <section class="note">
            <p class="eyebrow">baca</p>
            <h2 id="pep-talk">Senin, yang bae bae deh</h2>
            <p id="pep-detail">
                Suka suka gw
            </p>
        </section>

        <footer>iseng</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
